name: MacOS - build wheels

on:
  push:
    branches: [ main, navin_fixing_issues ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_wheels:
    name: Build wheels on macos-latest
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Initialize and update git submodules
      run: |
        git submodule update --init --recursive

    # Force compilation with LLVM's clang because Apple clang doesn't work well
    - name: Install MacOS dependencies
      run: |
        brew install libomp armadillo llvm
        brew link llvm --force
        brew link armadillo --force

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.16.2
      env:
        CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
        CIBW_SKIP: "*-win32 *-manylinux_i686"
        CIBW_BEFORE_BUILD: |
          git submodule update --init --recursive
        CIBW_ENVIRONMENT_MACOS: |
          CC=/opt/homebrew/opt/llvm/bin/clang
          CXX=/opt/homebrew/opt/llvm/bin/clang++
          LDFLAGS="-L/opt/homebrew/opt/llvm/lib -L/opt/homebrew/opt/armadillo/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib"
          CPPFLAGS="-I/opt/homebrew/opt/llvm/include -I/opt/homebrew/opt/armadillo/include"
        CIBW_TEST_COMMAND: |
          python -c "import banditpam; print('BanditPAM import successful')"

    - name: Upload wheels
      uses: actions/upload-artifact@v4  # Fixed: Updated from v3 to v4
      with:
        name: wheels-macos
        path: wheelhouse/*.whl
        retention-days: 30