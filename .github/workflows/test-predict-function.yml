name: Test Predict Function Implementation

on:
  push:
    branches: [ navin_fixing_issues ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-predict-function:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libarmadillo-dev libopenblas-dev \
          checkinstall libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev \
          libbz2-dev libffi-dev zlib1g-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel pybind11 numpy carma
    
    - name: Build BanditPAM
      run: |
        export GITHUB_ACTIONS=true
        export CPLUS_INCLUDE_PATH=/usr/local/include/carma
        python setup.py build_ext --inplace
    
    - name: Test Predict Function
      run: |
        python test_predict.py
    
    
    - name: Basic functionality test
      run: |
        python -c "
        import numpy as np
        import banditpam
        
        # Create simple test data
        X = np.random.random((20, 2)).astype(np.float32)
        
        # Test basic functionality
        kmedoids = banditpam.KMedoids(n_medoids=3)
        kmedoids.fit(X, 'L2')
        
        # Test predict function exists and works
        X_new = np.random.random((5, 2)).astype(np.float32)
        kmedoids.predict(X_new)
        
        # Check that labels_predict is accessible
        labels = kmedoids.labels_predict
        print(f'✓ Predict function works! Generated {len(labels)} predictions')
        print(f'✓ Predictions: {labels}')
        "
